name: Async-context cross-tenant security boundary

on:
  pull_request:
    paths:
      - '.github/workflows/async-context-security-boundary.yml'
      - 'async_context/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/async-context-security-boundary.yml'
      - 'async_context/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: async-context-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY: ores-otel/ores.otel.log
  SOURCE_REF: hardening/async-context-fiber-snapshots-20260911

jobs:
  provenance:
    name: Resolve one immutable source candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - name: Check out exact security-test head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: harness
          persist-credentials: false
      - name: Resolve candidate branch exactly once
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git ls-remote "https://github.com/${SOURCE_REPOSITORY}.git" "refs/heads/${SOURCE_REF}" | awk 'NR == 1 {print $1}')
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate branch did not resolve to one full SHA' >&2; exit 1; }
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$source_sha" | tee "$RUNNER_TEMP/source-sha.txt"
      - name: Check out the resolved source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ steps.resolve.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Verify ancestry, cleanliness, and recursive ownership architecture
        env:
          SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = '${{ steps.resolve.outputs.source_sha }}'
          python3 harness/async_context/audit_source.py

  node:
    name: Node cross-tenant mutation and failure isolation
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.provenance.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Build exact source and run its context corpus
        working-directory: source
        run: |
          npm ci
          npm run build
          node --test tests/context*.test.mjs tests/execution-context.test.mjs
      - name: Run 256-way tenant mutation canary
        env:
          SOURCE_ROOT: ${{ github.workspace }}/source
        run: node harness/async_context/node_cross_tenant.mjs

  python:
    name: CPython contextvars cancellation and executor boundaries
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.provenance.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - name: Run complete contextvars tests
        run: |
          python -m pip install -e sdk/python
          python -m unittest discover -s sdk/python/tests -p 'test_*.py' -v

  go:
    name: Go race detector and nested map/slice ownership
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.provenance.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24.7'
          cache: false
      - name: Run context tests with data-race detection
        working-directory: sdk/go
        run: go test -race -count=3 ./...

  java:
    name: JVM 21 nested immutability, thread pools, and virtual threads
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.provenance.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Run guarded ThreadLocal and executor corpus
        working-directory: sdk/java
        run: bash test.sh

  ruby:
    name: Ruby same-thread Fiber isolation and recursive snapshot ownership
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.provenance.outputs.source_sha }}
          persist-credentials: false
      - name: Require a supported MRI and run the complete Ruby corpus
        working-directory: sdk/ruby
        run: |
          set -euo pipefail
          ruby --version
          ruby -e 'abort "Ruby 3.1+ required" if RUBY_VERSION.split(".").take(2).map(&:to_i) < [3, 1]'
          ruby test/next_loggers_test.rb

  result:
    name: Require every security-boundary certificate
    if: always()
    needs: [provenance, node, python, go, java, ruby]
    runs-on: ubuntu-24.04
    steps:
      - name: Reject failed, cancelled, or skipped runtime evidence
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          invalid = {name: value['result'] for name, value in results.items() if value['result'] != 'success'}
          if invalid:
              raise SystemExit(f'async-context security certificate incomplete: {invalid}')
          print('recursive snapshot and cross-tenant isolation certificate complete')
          PY
